[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stick-figures"
version = "0.2.0"
description = "One-command narrated, captioned stick-figure Shorts driven by episode.json"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.5.0",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2",
    "Pillow>=13.0",
    "numpy>=2.3",
    "edge-tts>=7.3",
    # free research and scripts (SCRIPT_PROVIDER=ollama): keyless DuckDuckGo search (the package formerly called
    # duckduckgo-search), page text extraction, and the Ollama HTTP API
    "ddgs>=9.10",
    "trafilatura>=2.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# The FastAPI studio (rig lane) keeps its own pins in requirements-studio.txt.
studio = ["fastapi==0.159.1", "uvicorn==0.54.0", "openai==3.36.1"]

[project.scripts]
stick = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]
