# nginx site for the Stick Figures web app on the VPS (the host's nginx already serves other sites on 80/443).
# Installed by `sh deploy/install.sh --apply-nginx` as /etc/nginx/sites-available/stick.conf (+ sites-enabled
# link); then `certbot --nginx -d stick.srv1747356.hstgr.cloud --redirect` adds the 443 server and the redirect
# to this same block. It proxies to the `web` container, published on 127.0.0.1:8020 only.

upstream stick_web_8020 {
    server 127.0.0.1:8020;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name stick.srv1747356.hstgr.cloud;

    # the Mac uploads the finished MP4 (the app's own limit is 300 MiB) and scene previews
    client_max_body_size 300m;
    client_body_timeout 900s;
    proxy_request_buffering off;          # stream uploads to the app instead of spooling them in nginx first

    access_log /var/log/nginx/stick.access.log;
    error_log /var/log/nginx/stick.error.log warn;

    location / {
        proxy_pass http://stick_web_8020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SET, not appended: the app's login throttle keys on the first X-Forwarded-For entry
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_max_temp_file_size 0;       # stream big downloads (the MP4) instead of buffering them to disk
    }
}
